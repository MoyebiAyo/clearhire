name = "clearhire-scheduler"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Isolation-first (spec Phase 5): deploy with MODE below UNSET so the cron
# only logs. Once confirmed running on schedule, set the secret MODE=live
# (wrangler secret put MODE) and redeploy — only then does it call the app.
# [vars]
# MODE = "log-only"

# Cron Triggers: reminders every 15 minutes, mailbox poll every 10.
[triggers]
crons = ["*/15 * * * *", "*/10 * * * *"]

# Secrets (set via `wrangler secret put …`):
#   APP_URL                  https://clearhire-rho.vercel.app
#   SHARED_SECRET            must equal CLOUDFLARE_WORKER_SHARED_SECRET
#   MODE                     set to "live" after the isolation phase
